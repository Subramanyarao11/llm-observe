apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: llm-observe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: llm-observe-worker:latest
          envFrom:
            - configMapRef:
                name: llm-observe-config
