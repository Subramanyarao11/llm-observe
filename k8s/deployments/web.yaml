apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: llm-observe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: llm-observe-web:latest
          ports:
            - containerPort: 80
